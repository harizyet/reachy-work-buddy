[project]
name = "reachy-work-companion"
version = "0.0.1"
description = "Office work companion built on Reachy Mini: reasoning, sessions, and embodiment as separate services."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
