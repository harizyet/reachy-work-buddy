[project]
name = "reachy-work-companion"
version = "0.0.1"
description = "Office work companion built on Reachy Mini: reasoning, sessions, and embodiment as separate services."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv.workspace]
# Only services with their own pyproject.toml can be workspace members.
# Add companion-core and reachy-hub here once their Phases (4+) give them one.
members = ["services/reachy-embodiment"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
