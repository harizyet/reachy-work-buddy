[project]
name = "reachy-work-companion"
version = "0.0.1"
description = "Office work companion built on Reachy Mini: reasoning, sessions, and embodiment as separate services."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv.workspace]
members = ["services/reachy-embodiment", "services/reachy-hub", "services/companion-core"]

[tool.pytest.ini_options]
# Each service has its own tests/test_app.py; default (prepend) import mode
# would collide across services on the shared "tests" package name.
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
