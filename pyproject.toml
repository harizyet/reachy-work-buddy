[project]
name = "reachy-work-companion"
version = "0.0.1"
description = "Office work companion built on Reachy Mini: reasoning, sessions, and embodiment as separate services."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
# mediapipe (reachy-hub) requires opencv-contrib-python, which installs the
# same `cv2` module as the opencv-python-headless build the workspace uses;
# two distributions writing one module clobber each other. The never-true
# marker drops it; the headless `cv2` serves MediaPipe's gesture recognizer
# (checked 2026-09-25).
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.uv.workspace]
members = ["services/reachy-embodiment", "services/reachy-hub", "services/companion-core"]

# CPU-only torch: this machine (and the Reachy Mini) has no GPU, and the
# default PyPI torch/torchaudio wheels pull several GB of CUDA/cuDNN
# packages nothing here uses (reachy-embodiment's silero-vad dependency,
# Phase 8, is the only thing that needs torch at all). Workspace-level
# [tool.uv.sources]/[[tool.uv.index]] must live in the *root* pyproject.toml
# — the same keys in a member's pyproject.toml are silently ignored for
# index routing, which is what caused the first Phase 8 install to pull the
# full CUDA stack anyway despite being declared in
# services/reachy-embodiment/pyproject.toml.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Each service has its own tests/test_app.py; default (prepend) import mode
# would collide across services on the shared "tests" package name.
addopts = "--import-mode=importlib"
markers = [
    "slow: loads a real ML model (Whisper, Silero VAD) — real work, not mocked, but too slow for the default fast loop.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
