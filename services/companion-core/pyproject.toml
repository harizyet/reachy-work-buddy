[project]
name = "companion-core"
version = "0.0.1"
description = "Reasoning/tools, memory, RAG, calendar/email/tasks. See docs/adr/0001."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "reachy-work-companion",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion_core"]
