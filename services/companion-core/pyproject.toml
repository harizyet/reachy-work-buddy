[project]
name = "companion-core"
version = "0.0.1"
description = "Reasoning/tools, memory, RAG, calendar/email/tasks. See docs/adr/0001."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "reachy-work-companion",
    "sentence-transformers>=3.0",
    # torch: nothing here imports it directly — sentence-transformers
    # depends on it. Declared as an explicit direct dependency anyway to
    # anchor the root pyproject.toml's CPU-only [tool.uv.sources] override,
    # which is silently ignored for a package that's only ever transitive
    # (see the root pyproject.toml comment; same issue reachy-embodiment
    # hit with silero-vad in Phase 8).
    "torch",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion_core"]
