[project]
name = "model-manager"
version = "0.0.1"
description = "Local model lifecycle manager: swaps the vLLM server between the fast and deep tiers and always restores the fast tier. See docs/phase-42.md and ADR 0031."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "reachy-work-companion",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_manager"]
