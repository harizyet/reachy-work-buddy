[project]
name = "coding-agent-service"
version = "0.0.1"
description = "Coding-agent session supervisor: provider-neutral lifecycle, usage telemetry and input relay for containerized coding CLIs. See docs/phase-29.md."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reachy-work-companion",
    # 29.19: encrypts provider credentials (Claude Code API key, etc.) at
    # rest. Same AESGCM-file approach as companion_core.secrets.Keyring,
    # duplicated per ADR 0001 rather than imported across services.
    "cryptography>=45",
    # 29.27: the durable session store (postgres_store.py).
    "psycopg[binary,pool]>=3.2",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_service"]
