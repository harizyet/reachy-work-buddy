[project]
name = "reachy-embodiment"
version = "0.0.1"
description = "Semantic behaviour HTTP API for Reachy-side embodiment. See docs/adr/0003."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reachy-work-companion",
    # silero-vad's sequence_vad.py (its __init__ imports it unconditionally)
    # requires onnxruntime, but the base package's own Requires-Dist does
    # not include it — only the "onnx-cpu"/"onnx-gpu" extras do. An
    # unqualified "silero-vad>=5.1" resolves cleanly with uv/pip but fails
    # at import time (`ModuleNotFoundError: No module named 'onnxruntime'`)
    # on any environment where nothing else transitively pulls onnxruntime
    # in. Found via `uv sync --package reachy-embodiment` in isolation
    # (this service's actual Docker build shape) during Phase 22 Nano
    # verification — the shared multi-package dev venv (AGENTS.md) had
    # masked it, because reachy-hub's faster-whisper pulls onnxruntime in
    # transitively for itself. The "onnx-cpu" extra is the correct fix,
    # matching this repo's CPU-only convention (see torch/torchaudio's
    # source override in the root pyproject.toml).
    "silero-vad[onnx-cpu]>=5.1",
    "numpy>=2.0",
    # Phase 16/ADR 0013: JPEG-encodes SimulatedRobotBackend.capture_frame's
    # synthetic camera frames. No CUDA/GPU concerns (pure-Python/C image
    # lib), unlike torch below.
    "pillow>=10.0",
    # Required by FastAPI's UploadFile/File() (POST /audio/play). Found by
    # actually running the built Docker container, not by the test suite:
    # `uv sync --all-packages` installs every workspace member into one
    # shared dev venv (see AGENTS.md), so reachy-hub's own
    # python-multipart dependency silently covered this package too in
    # dev/tests — reachy-embodiment's own Docker image, built with
    # `--package reachy-embodiment` only, does not get that for free.
    "python-multipart>=0.0.9",
    # torch/torchaudio: nothing here imports these directly — silero-vad
    # depends on both. They're still declared as explicit direct
    # dependencies (not left purely transitive) because uv's [tool.uv.sources]
    # index override (root pyproject.toml — CPU-only build, see comment
    # there) is silently ignored for a package that's *only* a transitive
    # dependency; declaring it directly here "anchors" the override so it
    # actually takes effect. Confirmed by direct reproduction: identical
    # config resolved torch from PyPI (pulling ~4GB of CUDA packages) when
    # only silero-vad was listed, and from the CPU index once torch was
    # listed directly too.
    "torch",
    "torchaudio",
    # Phase 22: ReachyDaemonBackend's HTTP client to reachy-mini-daemon.
    # Same package/version floor companion-core and reachy-hub already use
    # to talk to each other (root pyproject.toml's dev group, their own
    # pyproject.tomls) — no new pattern introduced.
    "httpx>=0.27",
    # Phase 22: RobotWSClient's outbound connection to reachy-hub per ADR
    # 0019. uvicorn[standard] already pulls this in transitively (for its
    # own server-side WS support), but this service's own code imports it
    # directly (`import websockets`) — declared explicitly per this
    # repo's established rule (see the silero-vad/onnxruntime comment
    # above): never rely on a package being present only because
    # something else happens to pull it in transitively.
    "websockets>=13.0",
    # Phase 22b: ReachyDaemonBackend.capture_frame() only uses this for
    # cv2.imencode() (numpy BGR array -> JPEG bytes); frame capture itself
    # goes through reachy_mini's LOCAL media backend below, not V4L2
    # directly. -headless: no GUI/Qt bindings needed on a server process.
    # Ships permissive manylinux2014 wheels, not the manylinux_2_28 floor
    # that blocked torch/onnxruntime natively on the Nano's glibc 2.27.
    "opencv-python-headless>=4.9",
    # Phase 22b: the official same-host camera/audio path (huggingface.co/
    # docs/reachy_mini/SDK/media-architecture) — `ReachyMini(media_backend=
    # "local").media.get_frame()` reads frames from the daemon's local
    # GStreamer IPC socket instead of the release/acquire+V4L2 escape hatch
    # this replaced. Pulls in PyGObject on Linux (Requires-Dist in its own
    # metadata), which has no PyPI wheel and needs the Dockerfile's added
    # build deps; see that file's comment. Pinned to exactly match the
    # Nano's installed reachy-mini-daemon version (confirmed 1.8.4 live,
    # 2026-09-24) rather than a floor — the SDK client and the daemon it
    # talks to over the local IPC socket are the same project's two ends
    # of one protocol, and an unpinned newer client (1.11.0 resolved
    # unpinned during dev) risks a version-skewed wire format the daemon
    # doesn't understand. Bump deliberately alongside the daemon, not
    # independently. UNVERIFIED against real hardware end to end — PyGObject/
    # GStreamer/unixfdsrc were confirmed to install and import cleanly on
    # this same base image, but no live capture through this exact
    # pinned version has been run yet.
    "reachy_mini==1.8.4",
    # Phase 24e item 5: open-palm stop (reachy_embodiment/gesture.py).
    # Imported only when PALM_STOP_ENABLED=true. Pinned exactly because its
    # native aarch64 build is not yet verified on the Nano's Cortex-A57;
    # gesture.py probes it in a child process before loading it. Its
    # opencv-contrib-python dependency is overridden away in the root
    # pyproject.toml: it installs the same `cv2` module as the headless
    # build above, and the headless build serves MediaPipe's tasks API.
    "mediapipe==1.0.1",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }
# The pytorch-cpu index + torch/torchaudio source pins live in the root
# pyproject.toml — see the comment there for why.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_embodiment"]
