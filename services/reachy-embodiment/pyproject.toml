[project]
name = "reachy-embodiment"
version = "0.0.1"
description = "Semantic behaviour HTTP API for Reachy-side embodiment. See docs/adr/0003."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reachy-work-companion",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_embodiment"]
