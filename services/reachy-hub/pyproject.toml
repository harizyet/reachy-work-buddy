[project]
name = "reachy-hub"
version = "0.0.1"
description = "Robot registry, sessions, channels, routing, and auth. See docs/adr/0001."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "reachy-work-companion",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
    "aiortc>=1.9",
    "numpy>=2.0",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_hub"]
