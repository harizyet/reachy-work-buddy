[project]
name = "reachy-hub"
version = "0.0.1"
description = "Robot registry, sessions, channels, routing, and auth. See docs/adr/0001."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "reachy-work-companion",
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
    "aiortc>=1.9",
    "numpy>=2.0",
    # Phase 16/ADR 0013: decodes reachy-embodiment's JPEG camera frames into
    # av.VideoFrame for the telepresence WebRTC track (webrtc.py's
    # CameraPollTrack).
    "pillow>=10.0",
    "piper-tts>=1.3",
    # Phase 24e item 5: open-palm stop (reachy_hub/palm_stop.py), imported
    # only when PALM_STOP_ENABLED=true. Detection runs here rather than on
    # the robot. Its opencv-contrib-python dependency is overridden away in
    # the root pyproject.toml; the headless build below provides the `cv2`
    # MediaPipe imports.
    "mediapipe==1.0.1",
    "opencv-python-headless>=4.9",
]

[tool.uv.sources]
reachy-work-companion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_hub"]
