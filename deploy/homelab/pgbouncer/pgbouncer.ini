; PgBouncer for the homelab stack (Phase 45B, docs/phase-45.md). Transaction pooling. Reachable only on the compose network (no published port).
; Applications connect to pgbouncer:6432; migrations, key rotation, maintenance and recovery connect to postgres:5432 directly.
; Sizing basis: a read burst of 32 concurrent clients plus writers and the indexer needed at most 13 server connections (docs/phase-45.md).
[databases]
reachy_hub = host=postgres port=5432 dbname=reachy_hub

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 300
; Protocol-level prepared statements are tracked by PgBouncer 1.21+. The applications also set DB_PREPARE_THRESHOLD=off, so neither side relies on it.
max_prepared_statements = 100
; Bounded waiting: a client that cannot get a server connection fails after 10 s instead of hanging.
query_wait_timeout = 10
client_login_timeout = 10
server_idle_timeout = 300
server_lifetime = 1800
admin_users = reachy
stats_users = reachy
ignore_startup_parameters = extra_float_digits,options
