# Homelab control plane. Per docs/plan.md §1 non-goals, this is Docker
# Compose, not Kubernetes, for all initial releases.
#
# reachy-embodiment is included here too so the whole chain
# (companion-core -> reachy-hub -> reachy-embodiment) can be smoke-tested
# locally with one `docker compose up`. In a real deployment,
# reachy-embodiment runs on the Reachy Mini itself (see deploy/reachy/), not
# in this stack — this service definition exists for local/dev integration
# testing, not production topology.
#
# Redis is deliberately not included yet (docs/plan.md §8 lists it as
# "optional"); AgentSession state (Phase 5) turned out to fit fine in
# Postgres (see reachy_hub/postgres_session_store.py) rather than needing a
# separate cache — nothing else has made a concrete case for Redis yet.

services:
  postgres:
    # pgvector/pgvector, not plain postgres: Phase 13's RAG document store
    # needs the pgvector extension (`CREATE EXTENSION vector`) for
    # similarity search. This image is the same Postgres 16 with that
    # extension pre-built in, nothing else about it differs.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reachy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-reachy_hub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reachy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Phase 14's SMTP target — a real local SMTP server (real protocol
    # handshake) with a web UI to inspect what got "sent", so the send
    # path can be verified for real without needing a real mailbox or
    # personal credentials. Exposed on 8025 for the UI; SMTP stays
    # internal-only (companion-core talks to it as "mailpit:1025").
    #
    # Phase 22: gated behind the "simulation" profile — a production
    # deployment must point companion-core's SMTP_HOST/PORT at a real
    # relay (see .env.example), not this fake mailbox. `docker compose
    # --profile simulation up` (what scripts/start-homelab.sh's
    # `--simulation` flag passes) includes it; a bare `up` does not.
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["simulation"]
    ports:
      - "8025:8025"
    expose:
      - "1025"

  searxng:
    # Phase 24a: self-hosted search backend for companion-core's websearch
    # grounding (docs/phase-24a.md, ADR 0022) — same "self-hosted by
    # default, opt-in cloud provider" shape as the LLM stack's OVMS
    # default. Not simulation-gated: unlike mailpit (a fake mailbox), this
    # is real self-hosted infrastructure meant for production use too.
    # Harmless if unused — the websearch policy defaults to Off, so
    # nothing calls this until an operator turns it on in Settings.
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # The image's own settings loader reads this specific variable name
      # (SEARXNG_SECRET, not SEARXNG_SECRET_KEY) into server.secret_key —
      # confirmed against searx/settings_defaults.py; the image refuses to
      # serve requests while that value is still its "ultrasecretkey"
      # placeholder. Phase 24 cleanup: scripts/start-homelab.sh generates
      # and exports SEARXNG_SECRET_KEY itself (deploy/homelab/
      # .env.searxng-secret) — an operator running `docker compose` directly
      # instead of through that launcher must set it themselves.
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY:?set SEARXNG_SECRET_KEY, or start this stack via scripts/start-homelab.sh which generates it for you}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    # Internal-only, same pattern as mailpit's SMTP port below: reachable
    # from companion-core as "http://searxng:8080" — Settings -> Web search's
    # "Built-in SearXNG" provider option already knows this address, no
    # operator entry needed. Never published to the host.
    expose:
      - "8080"

  diarization:
    # Phase 27.3 (docs/phase-27.md, ADR 0025): Nemotron-3-Diarization
    # (NeMo Sortformer) with its per-chunk network step on OpenVINO.
    # Ported from local experimentation (previously tested standalone,
    # not part of this repo) into deploy/homelab/diarization/ — see that
    # Dockerfile's header comment. companion-core's MeetingWorker calls
    # this (companion_core/meetings/speech_clients.py's
    # HTTPDiarizationClient) whenever a job reaches DIARIZING; if this
    # service isn't running that call just fails to connect and the
    # worker retries later, so deploying it is not itself gating anything.
    #
    # Gated behind the "diarization" profile, unlike searxng above: it
    # needs an Intel iGPU passthrough (/dev/dri) that not every homelab
    # host has, and would hard-fail `docker compose up` on one that
    # doesn't. `scripts/start-homelab.sh --diarization` enables it.
    build: ./diarization
    image: reachy-diarization:latest
    restart: unless-stopped
    profiles: ["diarization"]
    user: "${DIARIZATION_UID:-1000}:${DIARIZATION_GID:-1000}"
    group_add:
      # The group owning /dev/dri/renderD* on the host — find it with
      # `stat -c %g /dev/dri/renderD128`. Left at a common default (990)
      # since it varies by distro/driver version.
      - "${DIARIZATION_RENDER_GID:-990}"
    devices:
      - /dev/dri:/dev/dri
    environment:
      OV_DEVICE: ${DIARIZATION_OV_DEVICE:-GPU}
      OV_PRECISION: ${DIARIZATION_OV_PRECISION:-}
      # ADR 0025's authenticated-service-to-service-calls target; unset
      # (default) means no check, same as before this existed — only the
      # Compose-internal network can reach this port either way.
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
    volumes:
      - diarization-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    expose:
      - "8010"

  transcription:
    # Phase 27.2 (docs/phase-27.md, ADR 0025): long-form meeting
    # transcription with faster-whisper, deployed as its own sidecar
    # rather than inside companion-core (which must not own Whisper
    # itself) or reused from reachy-hub's conversational stt.py (sibling
    # imports across services are banned, ADR 0001). See
    # deploy/homelab/transcription/app/server.py's header comment.
    # companion-core's MeetingWorker calls this
    # (HTTPTranscriptionClient) whenever a job reaches TRANSCRIBING; same
    # not-gating-anything reasoning as the diarization service above.
    #
    # Gated behind its own "transcription" profile: CPU-only by default
    # (no device passthrough needed, unlike diarization's Intel iGPU),
    # but it downloads a real Whisper model on first start and is not
    # something every deployment wants running.
    # `scripts/start-homelab.sh --transcription` enables it.
    build: ./transcription
    image: reachy-transcription:latest
    restart: unless-stopped
    profiles: ["transcription"]
    environment:
      MEETING_STT_MODEL: ${MEETING_STT_MODEL:-small.en}
      MEETING_STT_COMPUTE_TYPE: ${MEETING_STT_COMPUTE_TYPE:-int8}
      MEETING_STT_DEVICE: ${MEETING_STT_DEVICE:-cpu}
      # Same token as the diarization service's, above.
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
    volumes:
      - transcription-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    expose:
      - "8011"

  reachy-embodiment:
    # Phase 22: gated behind the "simulation" profile, matching the
    # module docstring above this file — production reachy-embodiment
    # runs on the Reachy Mini/Jetson itself (deploy/reachy/), started by
    # scripts/start-reachy.sh, not in this stack. A bare `docker compose
    # up` no longer starts this service; `--profile simulation` does.
    build:
      context: ../..
      dockerfile: services/reachy-embodiment/Dockerfile
    restart: unless-stopped
    profiles: ["simulation"]
    expose:
      - "8000"

  migrate:
    build:
      context: ../..
      dockerfile: services/companion-core/Dockerfile
    restart: "no"
    command: ["/app/.venv/bin/python", "-m", "companion_core.migrations", "upgrade"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-reachy_hub}
      SECRET_KEY_FILE: /run/secrets/credential_keys
    secrets:
      - credential_keys
    depends_on:
      postgres:
        condition: service_healthy

  reachy-hub:
    build:
      context: ../..
      dockerfile: services/reachy-hub/Dockerfile
    restart: unless-stopped
    secrets:
      - credential_keys
    environment:
      ACCOUNTS_SERVICE_TOKEN: ${ACCOUNTS_SERVICE_TOKEN:?set ACCOUNTS_SERVICE_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:-default-user}
      # Phase 26d: encrypts OWNER_RECOGNITION_CAPTURE_DIR's benchmark
      # captures at rest (reachy_hub/keyring.py). Same key file/secret as
      # companion-core's SECRET_KEY_FILE below, reused rather than
      # duplicated — see docs/deployment.md#key-provisioning.
      SECRET_KEY_FILE: /run/secrets/credential_keys
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-reachy_hub}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      COMPANION_CORE_URL: http://companion-core:8000
      # Optional (Phase 7): unset means no Telegram bot, no polling — the
      # rest of the stack works fine without it. Set TELEGRAM_BOT_TOKEN in
      # .env to enable; TELEGRAM_DEFAULT_USER_ID must match the user_id
      # used on other channels for cross-channel session continuity to work.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_DEFAULT_USER_ID: ${TELEGRAM_DEFAULT_USER_ID:-default-user}
      # Phase 16/ADR 0013: unset means the whole remote-control surface
      # (/robots/*, /webrtc/telepresence/offer, /robots/*/speak) 503s —
      # fail closed, not open. Set REMOTE_UI_TOKEN in .env to enable remote
      # telepresence. companion-core needs the same value (below) since its
      # /debug/robots/... proxy calls these same gated routes internally.
      REMOTE_UI_TOKEN: ${REMOTE_UI_TOKEN:-}
      # Phase 22/ADR 0019: unset means no robot can authenticate the WSS
      # control connection (fails closed, same pattern as REMOTE_UI_TOKEN
      # above) — required for a real robot to connect in production, not
      # needed for `--simulation` (reachy-embodiment's HTTP path doesn't
      # use this at all). See scripts/start-reachy.sh/start-jetson.sh and
      # services/reachy-hub/src/reachy_hub/robot_credential_store.py.
      ROBOT_TOKENS: ${ROBOT_TOKENS:-}
      # Phase 24e item 5 (ADR 0023 addendum): true lets a held open palm
      # stop a robot's spoken reply. The robot uploads frames only while a
      # reply plays; they are classified here in memory and never stored.
      # Off by default until physically accepted.
      PALM_STOP_ENABLED: ${PALM_STOP_ENABLED:-false}
      # Phase 25a.4: gates each voice transcript on RequestSensitivity/
      # effective_trust before it reaches Companion Core. Off by default —
      # with no real speaker/visual verifier wired in yet, enabling this
      # would block most everyday PERSONAL/CONSEQUENTIAL/UNKNOWN voice
      # requests. Do not turn on until that tradeoff is explicitly accepted.
      VOICE_SENSITIVITY_GATE_ENABLED: ${VOICE_SENSITIVITY_GATE_ENABLED:-false}
      # faster-whisper model for robot and /voice/turn speech; unset keeps
      # base.en. A new model downloads once after a rebuild (the hub warms
      # it at startup).
      STT_MODEL: ${STT_MODEL:-}
      # ADR 0023 robot voice limits; unset keeps the defaults (1500 ms,
      # 700 ms, 600 s). Bounds are enforced at startup.
      VOICE_CONTINUATION_WINDOW_MS: ${VOICE_CONTINUATION_WINDOW_MS:-}
      VOICE_END_OF_SPEECH_SILENCE_MS: ${VOICE_END_OF_SPEECH_SILENCE_MS:-}
      VOICE_MAX_SESSION_SECONDS: ${VOICE_MAX_SESSION_SECONDS:-}
      # Phase 25a.2/25b.3 (docs/phase-25.md "Enrollment portal"): raw
      # voice/face sample capture only, no biometric template/model yet
      # (reachy_hub/enrollment_store.py, reachy_hub/owner_recognition.py).
      # Unset keeps samples in memory (lost on restart); this compose file
      # sets it by owner request (2026-09-28) so samples captured through
      # Settings · Accounts survive a container recreate, backed by the
      # owner-recognition-captures volume below.
      OWNER_RECOGNITION_CAPTURE_DIR: ${OWNER_RECOGNITION_CAPTURE_DIR:-/data/owner-recognition-captures}
    volumes:
      - owner-recognition-captures:/data/owner-recognition-captures
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # No depends_on companion-core here: companion-core depends_on
    # reachy-hub already, and Compose doesn't allow a startup cycle. The
    # reachy-hub -> companion-core call only happens per-request (POST
    # /messages), not at reachy-hub startup, so this is fine — a request
    # arriving before companion-core is ready just gets a 502.
    expose:
      - "8000"

  companion-core:
    build:
      context: ../..
      dockerfile: services/companion-core/Dockerfile
    restart: unless-stopped
    secrets:
      - credential_keys
    environment:
      ACCOUNTS_SERVICE_TOKEN: ${ACCOUNTS_SERVICE_TOKEN:?set ACCOUNTS_SERVICE_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:-default-user}
      SECRET_KEY_FILE: /run/secrets/credential_keys
      REACHY_HUB_URL: http://reachy-hub:8000
      # Phase 10: companion-core's own Postgres connection (calendar store,
      # later joined by tasks/memory/rag) — previously entirely stateless.
      # Shares the same Postgres instance as reachy-hub, different tables
      # (a single-tenant homelab has no reason to run two database
      # containers).
      DATABASE_URL: postgresql://${POSTGRES_USER:-reachy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-reachy_hub}
      # Mailpit is simulation-only; production selects a relay explicitly.
      # Authenticated SMTP requires STARTTLS and resolves a core SecretStore
      # reference or an explicit environment bootstrap password.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECRET_REF: ${SMTP_SECRET_REF:-}
      # ADR 0011: real production default is 10 minutes (unset both). For
      # local/dev testing, override in .env — e.g.
      # EMAIL_SEND_DELAY_SECONDS=10 EMAIL_DISPATCH_INTERVAL_SECONDS=2 — to
      # avoid a genuine 10-minute wait every time the send path needs
      # exercising. Left unset here rather than given a short default, so
      # this compose file's own default behavior still matches production.
      EMAIL_SEND_DELAY_SECONDS: ${EMAIL_SEND_DELAY_SECONDS:-}
      EMAIL_DISPATCH_INTERVAL_SECONDS: ${EMAIL_DISPATCH_INTERVAL_SECONDS:-}
      # Phase 16/ADR 0013: same value as reachy-hub's, above — companion-
      # core's HubClient sends it as a bearer token to reach reachy-hub's
      # now-gated /robots/{id}/... routes from /debug/robots/....
      REMOTE_UI_TOKEN: ${REMOTE_UI_TOKEN:-}
      # Phase 27.1: uploaded meeting recordings, same "large binaries don't
      # belong in Postgres rows" reasoning as OWNER_RECOGNITION_CAPTURE_DIR
      # above, except this one is not optional — 27.1's exit criterion is
      # that an uploaded recording survives a service restart, so the
      # meetings volume below is always mounted, not gated behind an unset
      # env var falling back to in-memory.
      MEETING_AUDIO_DIR: ${MEETING_AUDIO_DIR:-/data/meeting-audio}
      # Phase 27.2/27.3 (ADR 0025): the transcription/diarization sidecars'
      # internal DNS names — matching their service names below, so these
      # defaults work whenever `--transcription`/`--diarization` are used.
      # Neither being reachable is a startup requirement (see
      # meetings/speech_clients.py) — companion-core starts fine without
      # either sidecar running; jobs just rest at TRANSCRIBING/DIARIZING.
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-http://transcription:8011}
      DIARIZATION_URL: ${DIARIZATION_URL:-http://diarization:8010}
      # Same token as the sidecars' own SPEECH_SERVICE_TOKEN — must match
      # for the clients' calls to authenticate once either sidecar has one
      # set. Unset on all three (default) means no auth is enforced.
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
    volumes:
      - meeting-audio:/data/meeting-audio
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      reachy-hub:
        condition: service_started
      # No mailpit dependency here (Phase 22): it's now `--simulation`-only
      # (see its own profile comment above), so a production `up` without
      # that flag doesn't include it at all — Compose refuses to start a
      # service that depends_on one gated out by profile. SMTP is only
      # touched when an email actually sends, not at companion-core
      # startup, so this doesn't need a startup-order guarantee anyway —
      # same reasoning as the reachy-hub/companion-core comment below.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - reachy-hub
      - companion-core

volumes:
  postgres-data:
  caddy-data:
  searxng-data:
  # Phase 25a.2/25b.3: raw owner-recognition voice/face captures (see
  # OWNER_RECOGNITION_CAPTURE_DIR above). Capture payloads use AES-GCM;
  # metadata sidecars remain plaintext. Restrict host access. Key-domain
  # separation remains planned in docs/phase-26.md#26d-key-domains.
  owner-recognition-captures:
  # Phase 27.1: uploaded meeting recordings (see MEETING_AUDIO_DIR above).
  # Unlike owner-recognition-captures this is not encrypted at rest —
  # meeting audio isn't biometric capture data, and 27.16's local-first
  # privacy control is about outbound processing (never leaving the
  # homelab by default), not encryption of this volume.
  meeting-audio:
  # Phase 27.3: the diarization service's downloaded HF weights and
  # exported ONNX graph (see its own service comment above). Losing this
  # volume just costs a re-download/re-export on next start, not data.
  diarization-data:
  # Phase 27.2: the transcription service's downloaded Whisper model.
  # Same re-download-not-data-loss reasoning as diarization-data above.
  transcription-data:

secrets:
  credential_keys:
    file: ${SECRET_KEY_FILE:-./.env.secret-keys.json}
