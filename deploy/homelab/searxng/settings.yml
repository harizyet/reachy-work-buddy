# Phase 24a: self-hosted SearXNG for companion-core's websearch grounding
# (docs/phase-24a.md, ADR 0022). Merged onto the image's own default
# settings/engines (use_default_settings), not a from-scratch config —
# only the fields this deployment actually needs to change are listed.
#
# `secret_key` stays the image's own placeholder here; the application
# itself overrides it at process start from the container's SEARXNG_SECRET
# environment variable (searx/settings_defaults.py's environ_name) — set
# via docker-compose.yml's SEARXNG_SECRET_KEY (see .env.example) — rather
# than baking a real secret into this checked-in file.
# Phase 24d: search runs inside a spoken turn, so the whole call must stay
# near a second. The default engine set waited ~3 s on Wikidata timeouts
# and DuckDuckGo CAPTCHAs; alone, Bing answered in ~0.3 s, Google in ~0.6–1.2 s
# and Brave in ~0.5 s (Brave soon rate-limits, which the timeout absorbs).
use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - brave

general:
  instance_name: "reachy-searxng"

server:
  secret_key: "ultrasecretkey"
  # This instance is reachable only from other containers on the compose
  # network (docker-compose.yml exposes it internally, never publishes it
  # to the host) — companion-core is the only real caller, so the public
  # bot/rate limiter that a Internet-facing SearXNG needs would only get in
  # the way here.
  limiter: false

search:
  # The image disables the JSON API by default (it's meant for a public
  # instance's own web UI); companion_core/websearch/searxng.py calls
  # `?format=json`, so this internal-only instance needs it enabled.
  formats:
    - html
    - json

outgoing:
  # Per-engine wait. Engines that miss it are skipped for that query, and
  # the others' results are still returned.
  request_timeout: 1.5
  max_request_timeout: 2.0

# keep_only keeps each engine's default flags, and the image ships Google
# and Bing disabled.
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
